name: Tests

# Needs no repository secrets and no repository variables. Every environment
# variable a job relies on is set in this file to a throwaway value, and
# Postgres comes from a service container. Nothing here deploys or publishes.
# No step pushes or fetches after the checkout, so every checkout sets
# persist-credentials: false and the job token is not left in .git/config for
# the steps that run the repository's code.

on:
  # Manual trigger: re-run CI on demand without manufacturing a code push.
  workflow_dispatch:
  push:
    # Pushes to the default branch only; every other branch is covered by the
    # pull_request trigger below, so a PR branch is not tested twice per push.
    # (auto/** branches are created by the roadmap executor and get their run
    # from the draft PR it opens.)
    branches: [main, master]
  pull_request:

permissions:
  contents: read

# Cancel an in-progress run for the same PR or branch when a newer commit
# lands, so rapid fixups do not stack up runs.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run unit tests
        run: npm test

  python:
    name: Python Tests
    runs-on: ubuntu-24.04
    # tests/ runs twice here (default and v1) and includes tests that drive the
    # real executor loop in throwaway repositories, which take several minutes.
    timeout-minutes: 60

    env:
      # Throwaway credentials for the service container below.
      DATABASE_URL: postgresql://cas:cas@localhost:5432/cas_test

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: cas
          POSTGRES_PASSWORD: cas
          POSTGRES_DB: cas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.worker.txt
            requirements-dev.txt

      - name: Install dependencies
        # requirements.worker.txt carries the worker + contract (BS4 +
        # soupsieve) pins. requirements-dev.txt is a superset for pytest;
        # installing both guarantees the contract framework test suite
        # resolves identically to a worker rebuild.
        run: pip install -r requirements.worker.txt -r requirements-dev.txt

      - name: Lint (ruff)
        # Correctness rules only; ruff.toml says what is and is not enforced.
        run: ruff check .

      # The v2 engine's widget and view tests render EJS with Node, using the
      # ejs package from web/node_modules. Without this install they skip.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies (EJS for the engine's render tests)
        run: cd web && npm ci

      - name: Install the Chromium the layout parse tests use
        run: cd web && npx playwright install --with-deps chromium

      - name: Build the sample generated site and install its dependencies
        # Five modules in compose/tests boot a generated site; they skip
        # unless builds/sample-healer/node_modules exists (builds/ is
        # gitignored). The generated app ships no lockfile, hence npm install.
        # CAS_LINT_EXTERNAL_URLS=skip: outside pytest the build would send
        # HEAD requests to the image hosts named in the sample spec.
        env:
          CAS_LINT_EXTERNAL_URLS: skip
        run: |
          python3 -m compose.build compose/fixtures/sample-healer-spec.json
          cd builds/sample-healer
          npm install --no-audit --no-fund

      - name: Run Python tests
        run: python3 -m pytest tests/ -q --tb=short

      - name: Run v2 compose-engine tests
        # Isolated pytest collection: compose/tests/ is a parallel subsystem
        # (static-compose build engine opted into via CAS_BUILD_ENGINE=v2).
        # Keeping it in its own invocation means conftest isolation and
        # makes regressions on the v2 engine visible as their own job step.
        run: python3 -m pytest compose/tests/ -q --tb=short

      - name: Run legacy v1 engine tests
        # The v1-only tests are skipped by default (see conftest.py). This
        # step opts in so the legacy engine's suite cannot rot unnoticed. The
        # two executor-loop files do not depend on the build engine and already
        # ran in the step above; leaving them out here saves several minutes.
        run: >-
          python3 -m pytest tests/ -q --tb=short
          --ignore=tests/test_executor_loop_behavior.py
          --ignore=tests/test_executor_loop_recovery.py
        env:
          CAS_BUILD_ENGINE: v1

  quickstart:
    name: Quickstart
    # Proves the README quickstart on a clean runner: Postgres from the repo's
    # docker-compose.yml, web/.env copied from the template, the app built and
    # started, and the home page served. No service container: compose provides
    # the database exactly as it does for a reader following the README.
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Start Postgres
        run: docker compose up -d --wait

      - name: Create web/.env from the template
        run: cp web/.env.example web/.env

      - name: Install dependencies and build
        run: cd web && npm ci && npm run build

      - name: Start the server
        # The server applies the schema at boot and listens on port 4000.
        run: |
          cd web
          nohup npm start > "$RUNNER_TEMP/server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/server.pid"

      - name: Wait for /health (up to 60 s)
        run: |
          for i in $(seq 1 60); do
            if curl -fsS -m 2 -o /dev/null http://localhost:4000/health 2>/dev/null; then
              echo "healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "server did not return 200 from /health within 60 s"
          exit 1

      - name: Check the home page serves HTML
        run: |
          curl -fsS http://localhost:4000/ -o "$RUNNER_TEMP/home.html"
          grep -q '<title' "$RUNNER_TEMP/home.html"

      - name: Show the /health body
        run: curl -fsS http://localhost:4000/health; echo

      - name: Dump logs on failure
        if: failure()
        run: |
          echo "=== server log ==="
          cat "$RUNNER_TEMP/server.log" || true
          echo "=== docker compose logs ==="
          docker compose logs --no-color || true

      - name: Stop the server
        if: always()
        run: kill "$(cat "$RUNNER_TEMP/server.pid")" 2>/dev/null || true

  worker-image:
    name: Worker image
    # Builds Dockerfile.worker and checks what the monitor's backups depend on:
    # the image's pg_dump is at least as new as the PostgreSQL major that
    # cli/deploy.py provisions for customer apps (POSTGRES_SERVER_MAJOR), and it
    # can dump a server of that major. The Playwright base image and the
    # PostgreSQL apt repository are downloaded, so this job needs the network
    # and takes a few minutes. The server password is generated here and used
    # only for this run.
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build the worker image
        run: docker build -f Dockerfile.worker -t cas-worker-image-check .

      - name: The image's pg_dump is new enough
        run: |
          set -o pipefail
          server_major=$(sed -nE 's/^POSTGRES_SERVER_MAJOR = ([0-9]+).*/\1/p' cli/deploy.py)
          test -n "$server_major"
          docker run --rm --entrypoint pg_dump cas-worker-image-check --version
          client_major=$(docker run --rm --entrypoint pg_dump cas-worker-image-check --version | sed -E 's/^pg_dump \(PostgreSQL\) ([0-9]+).*/\1/')
          echo "client $client_major, server $server_major"
          test "$client_major" -ge "$server_major"

      - name: The image's pg_dump can dump a server of that major
        run: |
          set -o pipefail
          server_major=$(sed -nE 's/^POSTGRES_SERVER_MAJOR = ([0-9]+).*/\1/p' cli/deploy.py)
          pw=$(openssl rand -hex 16)
          docker run -d --name pg-server -e POSTGRES_PASSWORD="$pw" -p 127.0.0.1:55432:5432 "postgres:$server_major"
          for i in $(seq 1 30); do
            docker exec pg-server pg_isready -U postgres && break
            sleep 2
          done
          docker run --rm --network host -e PGPASSWORD="$pw" --entrypoint pg_dump cas-worker-image-check \
            -h 127.0.0.1 -p 55432 -U postgres --schema-only postgres | tail -n 3

      - name: Stop the server
        if: always()
        run: docker rm -f pg-server 2>/dev/null || true

  secrets:
    name: Secret Scan
    # Scans the full history of the checkout with gitleaks, using the rules
    # and the single allowlist entry in .gitleaks.toml. The release tarball is
    # verified against its published SHA-256 before it runs.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks

      - name: Scan history
        run: '"$RUNNER_TEMP/gitleaks" detect --source . --config .gitleaks.toml --redact --no-banner --log-opts="--all"'

  audit:
    name: Dependency Audit (advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Advisory, not a gate: new advisories are published continuously against
    # pinned dependencies, so a hard gate on an archived repo would turn red
    # without any code change. The same scripts run as a blocking check in the
    # local pre-push hook (CAS_SKIP_AUDIT=1 bypasses). A failure here shows up
    # as a red job without failing the workflow run.
    continue-on-error: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.worker.txt
            requirements-dev.txt

      - name: Install audit tools (bandit + pip-audit are in requirements-dev.txt)
        # pip-audit resolves requirements.worker.txt and requirements-dev.txt
        # itself, so only the tools need installing here.
        run: pip install -r requirements-dev.txt

      - name: Audit npm dependencies (high+, prod only)
        # Mirrors .githooks/pre-push via scripts/run_dep_audit.sh. npm audit
        # reads web/package-lock.json, so no npm install is needed.
        run: ./scripts/run_dep_audit.sh

      - name: Audit Python source + deps (bandit + pip-audit)
        # Mirrors .githooks/pre-push via scripts/run_python_security_audit.sh.
        # bandit fails on any medium+ finding (there is no baseline file);
        # pip-audit fails on any vulnerable dep. CI=true (set by Actions)
        # makes the script require both tools to be installed.
        run: ./scripts/run_python_security_audit.sh

  ui:
    name: UI Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: unit
    defaults:
      run:
        working-directory: web

    env:
      # Throwaway values for a CI-only database and test user; none of them
      # are credentials for anything real.
      DATABASE_URL: postgresql://cas:cas@localhost:5432/cas_test
      SESSION_SECRET: ci-only-session-secret
      NODE_ENV: test
      DEV_TEST_EMAIL: ci@example.com
      DEV_TEST_PASSWORD: cipassword123
      # CAS Harbor is the canonical intake surface; UI tests exercise the
      # /intake -> /lighthouse/table redirect contract and the lighthouse
      # chat page. The mount in app.ts is gated on this flag.
      CAS_HARBOR_ENABLED: "true"
      # Fixtures that make tests/ui/lighthouse-a11y.spec.ts ACTUALLY RUN the
      # axe sweep instead of skipping. CAS_A11Y_DEV_TRIAL only needs to be
      # truthy; CAS_A11Y_LAMP_BUILD_ID matches the preview+approved fixture
      # build seeded by tests/ui/seed-test-db.js.
      CAS_A11Y_DEV_TRIAL: "a11c0de0-0000-4000-8000-00000000d2ec"
      CAS_A11Y_LAMP_BUILD_ID: "a11c0de0-0000-4000-8000-00000000a11c"

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: cas
          POSTGRES_PASSWORD: cas
          POSTGRES_DB: cas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      # One integration test runs the Python worker's real cleanup function
      # against the same rows the web app's publishing statement reads, so
      # this job needs a Python that can import queue/worker_pg.py.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.worker.txt

      - name: Install the worker's Python dependencies
        run: pip install -r ../requirements.worker.txt

      - name: Web integration tests against a real Postgres
        # In the unit job these files (schema.idempotency and every
        # *.realdb.test.ts) skip, because no database is configured there. Here
        # they get an empty database of their own (kept apart from the browser
        # fixtures) and execute the real schema and the real publish, payment,
        # signup, account-claim, support-KB and crisis statements. Serial
        # because each file applies schema.sql.
        env:
          CAS_SCHEMA_TEST_DATABASE_URL: postgresql://cas:cas@localhost:5432/cas_web_integration
          CAS_WORKER_PYTHON: python
        run: |
          psql postgresql://cas:cas@localhost:5432/cas_test -c 'CREATE DATABASE cas_web_integration'
          npx vitest run --no-file-parallelism tests/unit/schema.idempotency.test.ts tests/unit/*.realdb.test.ts

      - name: Seed test database
        run: node tests/ui/seed-test-db.js

      - name: Run UI tests
        run: npm run test:ui

      - name: Upload Playwright report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: playwright-report
          path: web/playwright-report/
          if-no-files-found: ignore
